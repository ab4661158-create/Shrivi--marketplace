<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shrivi Marketplace - Admin</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #ddd;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #dashboard {
      display: none;
    }

    #message {
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>SHRIVI</h1>
  <p>Marketplace Admin Panel</p>
</header>

<div class="container">

  <div class="card">
    <h2>Admin Login</h2>

    <input
      type="text"
      id="username"
      placeholder="Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <p id="message"></p>
  </div>

  <div class="card" id="dashboard">

    <h2>Dashboard</h2>

    <p>Welcome to Shrivi Marketplace Admin.</p>

    <button onclick="logout()">Logout</button>

  </div>

</div>

<script>

function login() {

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  if (
    username === "admin" &&
    password === "Shrivi@123"
  ) {

    document.getElementById("message").innerText =
      "Login successful!";

    document.getElementById("dashboard").style.display =
      "block";

  } else {

    document.getElementById("message").innerText =
      "Wrong username or password.";

  }
}

function logout() {

  document.getElementById("dashboard").style.display =
    "none";

  document.getElementById("message").innerText = "";

}

</script>

</body>
</html>
