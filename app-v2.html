<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Shrivi Marketplace</title>

<style>
:root{
  --bg:#f6f7fb;
  --card:#fff;
  --ink:#111827;
  --muted:#6b7280;
  --accent:#ff6a00;
  --line:#e5e7eb;
  --dark:#111827;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  padding-bottom:76px;
}

button,input,textarea{font:inherit}
button{border:0;cursor:pointer}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#111827;
  color:#fff;
  padding:12px 14px 10px;
}

.bar{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  font-weight:900;
  font-size:24px;
}

.cart{
  margin-left:auto;
  background:#fff;
  color:#111827;
  border-radius:12px;
  padding:9px 12px;
  font-weight:800;
}

.search{
  margin-top:10px;
  display:flex;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

.search input{
  border:0;
  outline:0;
  flex:1;
  padding:12px;
}

.search button{
  background:#ffb000;
  padding:0 15px;
  font-weight:900;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:14px;
}

.hero{
  background:linear-gradient(135deg,#111827,#374151);
  color:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:16px;
}

.hero h1{
  margin:0 0 7px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#d1d5db;
}

.chips{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:2px 0 14px;
}

.chip{
  white-space:nowrap;
  background:#fff;
  border:1px solid var(--line);
  padding:9px 14px;
  border-radius:999px;
}

.chip.active{
  background:var(--dark);
  color:#fff;
}

.section{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:12px 0;
}

.section h2{
  font-size:19px;
  margin:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.product{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 12px #1118270a;
}

.pic{
  height:175px;
  background:#eef1f5;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  font-size:45px;
}

.body{
  padding:12px;
}

.name{
  font-weight:800;
  line-height:1.25;
  min-height:40px;
}

.seller{
  font-size:12px;
  color:var(--muted);
  margin:6px 0;
}

.price{
  font-size:20px;
  font-weight:900;
}

.old{
  text-decoration:line-through;
  color:#9ca3af;
  font-size:13px;
  margin-left:5px;
}

.off{
  color:#07833f;
  font-size:12px;
  font-weight:800;
}

.stock{
  font-size:12px;
  margin:6px 0;
  color:#6b7280;
}

.actions{
  display:flex;
  gap:7px;
}

.add,.buy{
  flex:1;
  padding:10px;
  border-radius:10px;
  font-weight:800;
}

.add{
  background:#ffe08a;
}

.buy{
  background:#ff8a00;
  color:#111;
}

.add:disabled,.buy:disabled{
  background:#ddd;
  color:#888;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
  grid-column:1/-1;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:30;
}

.nav{
  background:none;
  color:#6b7280;
  font-size:11px;
}

.nav.active{
  color:#111827;
  font-weight:900;
}

.nav span{
  display:block;
  font-size:21px;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:flex-end;
  z-index:50;
}

.sheet{
  background:#fff;
  border-radius:22px 22px 0 0;
  max-height:92vh;
  overflow:auto;
  width:100%;
  padding:18px;
}

.close{
  float:right;
  background:#eee;
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:20px;
}

.detailImg{
  height:280px;
  background:#f1f3f5;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.detailImg img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.form input,
.form textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  margin:6px 0 10px;
  outline:none;
}

.primary{
  width:100%;
  padding:13px;
  border-radius:12px;
  background:#ff8a00;
  font-weight:900;
}

.order{
  background:#f8fafc;
  border:1px solid var(--line);
  padding:12px;
  border-radius:12px;
  margin:8px 0;
}

.qty{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.qty button{
  padding:7px 12px;
  border-radius:8px;
  background:#eee;
}

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:11px 15px;
  border-radius:12px;
  display:none;
  z-index:80;
}

@media(min-width:700px){

  .grid{
    grid-template-columns:repeat(4,1fr);
  }

  .modal{
    align-items:center;
  }

  .sheet{
    max-width:600px;
    border-radius:22px;
  }

  .bottom{
    display:none;
  }
}
</style>
</head>

<body>

<header class="top">

  <div class="bar">

    <div class="logo">
      SHRIVI
    </div>

    <button
      class="cart"
      onclick="openCart()"
    >
      🛒 <span id="cartCount">0</span>
    </button>

  </div>

  <div class="search">

    <input
      id="search"
      placeholder="Search products, brands & categories"
    >

    <button onclick="renderProducts()">
      Search
    </button>

  </div>

</header>

<main class="wrap">

  <section class="hero">

    <h1>
      Shop smarter with Shrivi
    </h1>

    <p>
      Discover products from trusted sellers at great prices.
    </p>

  </section>

  <div
    class="chips"
    id="chips"
  ></div>

  <div class="section">

    <h2>
      Latest Products
    </h2>

    <button onclick="loadProducts()">
      ↻ Refresh
    </button>

  </div>

  <div
    id="products"
    class="grid"
  >

    <div class="empty">
      Loading products...
    </div>

  </div>

</main>

<nav class="bottom">

  <button
    class="nav active"
    onclick="window.scrollTo({top:0,behavior:'smooth'})"
  >
    <span>⌂</span>
    Home
  </button>

  <button
    class="nav"
    onclick="document.getElementById('search').focus()"
  >
    <span>⌕</span>
    Search
  </button>

  <button
    class="nav"
    onclick="openCart()"
  >
    <span>🛒</span>
    Cart
  </button>

  <button
    class="nav"
    onclick="openTrack()"
  >
    <span>📦</span>
    Orders
  </button>

</nav>


<!-- PRODUCT DETAIL -->

<div
  id="detail"
  class="modal"
  onclick="if(event.target.id==='detail')closeModal('detail')"
>

  <div class="sheet">

    <button
      class="close"
      onclick="closeModal('detail')"
    >
      ×
    </button>

    <div id="detailBody"></div>

  </div>

</div>


<!-- CART -->

<div
  id="cart"
  class="modal"
  onclick="if(event.target.id==='cart')closeModal('cart')"
>

  <div class="sheet">

    <button
      class="close"
      onclick="closeModal('cart')"
    >
      ×
    </button>

    <h2>
      🛒 Your Cart
    </h2>

    <div id="cartBody"></div>

  </div>

</div>


<!-- CHECKOUT -->

<div
  id="checkout"
  class="modal"
>

  <div class="sheet">

    <button
      class="close"
      onclick="closeModal('checkout')"
    >
      ×
    </button>

    <h2>
      Checkout
    </h2>

    <div class="form">

      <input
        id="name"
        placeholder="Customer name"
      >

      <input
        id="phone"
        inputmode="numeric"
        maxlength="10"
        placeholder="10-digit mobile number"
      >

      <textarea
        id="address"
        rows="4"
        placeholder="Delivery address"
      ></textarea>

      <button
        class="primary"
        onclick="placeOrder()"
      >
        Place Order
      </button>

    </div>

  </div>

</div>


<!-- TRACK -->

<div
  id="track"
  class="modal"
>

  <div class="sheet">

    <button
      class="close"
      onclick="closeModal('track')"
    >
      ×
    </button>

    <h2>
      📦 Track Order
    </h2>

    <div class="form">

      <input
        id="orderId"
        inputmode="numeric"
        placeholder="Enter Order ID"
      >

      <button
        class="primary"
        onclick="trackOrder()"
      >
        Track Order
      </button>

    </div>

    <div id="trackResult"></div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

let products = [];

let cart =
  JSON.parse(
    localStorage.getItem("shrivi_cart") || "[]"
  );

let category = "All";

const $ =
  id =>
    document.getElementById(id);


const money =
  n =>
    "₹" +
    Number(n || 0).toLocaleString(
      "en-IN"
    );


function saveCart(){

  localStorage.setItem(
    "shrivi_cart",
    JSON.stringify(cart)
  );

  updateCartCount();

}


function updateCartCount(){

  $("cartCount").textContent =
    cart.reduce(
      (total,item) =>
        total +
        Number(item.quantity || 0),
      0
    );

}


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>'"]/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"
      }[char])
    );

}


function toast(message){

  $("toast").textContent =
    message;

  $("toast").style.display =
    "block";

  setTimeout(
    () => {
      $("toast").style.display =
        "none";
    },
    1800
  );

}


/* LOAD PRODUCTS */

async function loadProducts(){

  const box =
    $("products");

  box.innerHTML = `
    <div class="empty">
      Loading products...
    </div>
  `;

  try{

    const response =
      await fetch(
        "/api/products?_" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );

    if(!response.ok){

      throw new Error(
        "Products API error: " +
        response.status
      );

    }

    const data =
      await response.json();

    if(!Array.isArray(data)){

      throw new Error(
        "Products response is not an array"
      );

    }

    products =
      data;

    buildCategories();

    renderProducts();

  }catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="empty">

        <h3>
          Products load nahi ho rahe
        </h3>

        <p>
          Please Refresh try karo.
        </p>

        <button
          class="primary"
          onclick="loadProducts()"
        >
          Retry
        </button>

      </div>
    `;

  }

}


/* CATEGORIES */

function buildCategories(){

  const categories = [
    "All",
    ...new Set(
      products
        .map(
          product =>
            product.category
        )
        .filter(Boolean)
    )
  ];

  $("chips").innerHTML =
    categories
      .map(
        cat => `
          <button
            class="chip ${
              cat === category
                ? "active"
                : ""
            }"
            onclick='selectCategory(${JSON.stringify(cat)})'
          >
            ${esc(cat)}
          </button>
        `
      )
      .join("");

}


function selectCategory(cat){

  category =
    cat;

  buildCategories();

  renderProducts();

}


/* RENDER */

function renderProducts(){

  const searchText =
    $("search")
      .value
      .trim()
      .toLowerCase();

  const filtered =
    products.filter(
      product => {

        const matchesCategory =
          category === "All" ||
          String(
            product.category || ""
          ) === category;

        const matchesSearch =
          !searchText ||
          [
            product.name,
            product.category,
            product.description,
            product.seller_name
          ]
          .some(
            value =>
              String(value || "")
                .toLowerCase()
                .includes(searchText)
          );

        return (
          matchesCategory &&
          matchesSearch
        );

      }
    );

  if(!filtered.length){

    $("products").innerHTML = `
      <div class="empty">
        No products found.
      </div>
    `;

    return;

  }

  $("products").innerHTML =
    filtered
      .map(productCard)
      .join("");

}


/* PRODUCT CARD */

function productCard(product){

  const salePrice =
    Number(
      product.sale_price ??
      product.price
    ) || 0;

  const originalPrice =
    Number(
      product.original_price ??
      product.price
    ) || 0;

  const stock =
    Number(
      product.stock || 0
    );

  return `

    <article class="product">

      <div
        class="pic"
        onclick="openDetail(${Number(product.id)})"
      >

        ${
          product.image

          ?

          `
            <img
              src="${esc(product.image)}"
              alt="${esc(product.name)}"
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='block'
              "
            >

            <div
              class="placeholder"
              style="display:none"
            >
              🛍️
            </div>
          `

          :

          `
            <div class="placeholder">
              🛍️
            </div>
          `
        }

      </div>

      <div class="body">

        <div class="name">
          ${esc(product.name)}
        </div>

        <div class="seller">
          Sold by
          ${esc(
            product.seller_name ||
            "Shrivi"
          )}
        </div>

        <div class="price">

          ${money(salePrice)}

          ${
            originalPrice >
            salePrice

            ?

            `
              <span class="old">
                ${money(originalPrice)}
              </span>
            `

            :

            ""
          }

        </div>

        ${
          Number(
            product.discount_percent
          ) > 0

          ?

          `
            <div class="off">
              ${
                Number(
                  product.discount_percent
                )
              }% OFF
            </div>
          `

          :

          ""
        }

        <div class="stock">

          ${
            stock > 0
              ? `${stock} in stock`
              : "Out of stock"
          }

        </div>

        <div class="actions">

          <button
            class="add"
            onclick="
              addToCart(
                ${Number(product.id)}
              )
            "
            ${
              stock <= 0
                ? "disabled"
                : ""
            }
          >
            Add
          </button>

          <button
            class="buy"
            onclick="
              buyNow(
                ${Number(product.id)}
              )
            "
            ${
              stock <= 0
                ? "disabled"
                : ""
            }
          >
            Buy Now
          </button>

        </div>

      </div>

    </article>

  `;

}


/* FIND */

function findProduct(id){

  return products.find(
    product =>
      Number(product.id) ===
      Number(id)
  );

}


/* ADD TO CART */

function addToCart(
  id,
  quantity = 1
){

  const product =
    findProduct(id);

  if(!product){

    toast(
      "Product not found"
    );

    return;

  }

  const stock =
    Number(
      product.stock || 0
    );

  if(stock < 1){

    toast(
      "Out of stock"
    );

    return;

  }

  let existing =
    cart.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  const newQuantity =
    Number(
      existing?.quantity || 0
    ) +
    Number(quantity);

  if(
    newQuantity >
    stock
  ){

    toast(
      "Stock limit reached"
    );

    return;

  }

  if(existing){

    existing.quantity =
      newQuantity;

  }else{

    cart.push({

      id:
        product.id,

      name:
        product.name,

      price:
        Number(
          product.sale_price ??
          product.price
        ) || 0,

      image:
        product.image,

      seller_name:
        product.seller_name,

      quantity:
        quantity

    });

  }

  saveCart();

  toast(
    "Added to cart"
  );

}


/* BUY NOW */

function buyNow(id){

  cart = [];

  saveCart();

  addToCart(id);

  openCheckout();

}


/* PRODUCT DETAILS */

function openDetail(id){

  const product =
    findProduct(id);

  if(!product){

    toast(
      "Product not found"
    );

    return;

  }

  const salePrice =
    Number(
      product.sale_price ??
      product.price
    ) || 0;

  const originalPrice =
    Number(
      product.original_price ??
      product.price
    ) || 0;

  $("detailBody").innerHTML = `

    <div class="detailImg">

      ${
        product.image

        ?

        `
          <img
            src="${esc(product.image)}"
            alt="${esc(product.name)}"
          >
        `

        :

        `
          <div class="placeholder">
            🛍️
          </div>
        `
      }

    </div>

    <h2>
      ${esc(product.name)}
    </h2>

    <p class="seller">

      Sold by
      ${esc(
        product.seller_name ||
        "Shrivi"
      )}

      ·

      ${esc(
        product.category ||
        "General"
      )}

    </p>

    <div class="price">

      ${money(salePrice)}

      ${
        originalPrice >
        salePrice

        ?

        `
          <span class="old">
            ${money(originalPrice)}
          </span>
        `

        :

        ""
      }

    </div>

    <p>
      ${esc(
        product.description ||
        "Quality product available on Shrivi."
      )}
    </p>

    <div class="stock">

      ${
        Number(product.stock) > 0
          ? `${product.stock} available`
          : "Out of stock"
      }

    </div>

    <div class="actions">

      <button
        class="add"
        onclick="
          addToCart(
            ${Number(product.id)}
          );
          closeModal('detail')
        "
      >
        Add to Cart
      </button>

      <button
        class="buy"
        onclick="
          closeModal('detail');
          buyNow(
            ${Number(product.id)}
          )
        "
      >
        Buy Now
      </button>

    </div>

  `;

  $("detail").style.display =
    "flex";

}


/* CART */

function openCart(){

  let total = 0;

  if(!cart.length){

    $("cartBody").innerHTML = `
      <div class="empty">
        Your cart is empty.
      </div>
    `;

  }else{

    $("cartBody").innerHTML =
      cart
        .map(
          item => {

            const price =
              Number(
                item.price || 0
              );

            const quantity =
              Number(
                item.quantity || 0
              );

            const itemTotal =
              price *
              quantity;

            total +=
              itemTotal;

            return `

              <div class="order">

                <b>
                  ${esc(item.name)}
                </b>

                <div>

                  ${money(price)}
                  ×
                  ${quantity}
                  =
                  <b>
                    ${money(itemTotal)}
                  </b>

                </div>

                <div class="qty">

                  <button
                    onclick="
                      changeQuantity(
                        ${Number(item.id)},
                        -1
                      )
                    "
                  >
                    −
                  </button>

                  <b>
                    ${quantity}
                  </b>

                  <button
                    onclick="
                      changeQuantity(
                        ${Number(item.id)},
                        1
                      )
                    "
                  >
                    +
                  </button>

                  <button
                    onclick="
                      removeItem(
                        ${Number(item.id)}
                      )
                    "
                  >
                    Remove
                  </button>

                </div>

              </div>

            `;

          }
        )
        .join("") +

      `

        <h2>
          Total:
          ${money(total)}
        </h2>

        <button
          class="primary"
          onclick="openCheckout()"
        >
          Proceed to Checkout
        </button>

      `;

  }

  $("cart").style.display =
    "flex";

}


/* QUANTITY */

function changeQuantity(
  id,
  difference
){

  const item =
    cart.find(
      x =>
        Number(x.id) ===
        Number(id)
    );

  const product =
    findProduct(id);

  if(!item){

    return;

  }

  item.quantity =
    Number(item.quantity) +
    Number(difference);

  if(
    item.quantity <= 0
  ){

    removeItem(id);

    return;

  }

  if(product){

    const stock =
      Number(
        product.stock || 0
      );

    if(
      item.quantity >
      stock
    ){

      item.quantity =
        stock;

      toast(
        "Stock limit reached"
      );

    }

  }

  saveCart();

  openCart();

}


/* REMOVE */

function removeItem(id){

  cart =
    cart.filter(
      item =>
        Number(item.id) !==
        Number(id)
    );

  saveCart();

  openCart();

}


/* CHECKOUT */

function openCheckout(){

  if(!cart.length){

    toast(
      "Cart is empty"
    );

    return;

  }

  closeModal(
    "cart"
  );

  $("checkout").style.display =
    "flex";

}


/* PLACE ORDER */

async function placeOrder(){

  const name =
    $("name")
      .value
      .trim();

  const phone =
    $("phone")
      .value
      .trim();

  const address =
    $("address")
      .value
      .trim();

  if(
    !name ||
    !/^[0-9]{10}$/.test(phone) ||
    !address
  ){

    toast(
      "Enter valid customer details"
    );

    return;

  }

  try{

    const response =
      await fetch(
        "/api/orders",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              customer_name:
                name,

              customer_phone:
                phone,

              customer_address:
                address,

              items:
                cart.map(
                  item => ({
                    id:item.id,
                    quantity:
                      item.quantity
                  })
                )

            })

        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Order failed"
      );

    }

    const orderId =
      data.order?.id ||
      data.id ||
      "";

    cart = [];

    saveCart();

    closeModal(
      "checkout"
    );

    $("name").value = "";
    $("phone").value = "";
    $("address").value = "";

    alert(
      "Order placed successfully!\n\n" +
      "Order ID: " +
      orderId
    );

    loadProducts();

  }catch(error){

    console.error(
      error
    );

    toast(
      error.message ||
      "Order failed"
    );

  }

}


/* TRACK */

function openTrack(){

  $("track").style.display =
    "flex";

}


async function trackOrder(){

  const id =
    Number(
      $("orderId").value
    );

  if(
    !Number.isInteger(id) ||
    id < 1
  ){

    toast(
      "Enter Order ID"
    );

    return;

  }

  $("trackResult").innerHTML = `
    <div class="empty">
      Loading order...
    </div>
  `;

  try{

    const response =
      await fetch(
        "/api/orders/track/" +
        id
      );

    const data =
      await response.json();

    if(response.ok){

      $("trackResult").innerHTML = `

        <div class="order">

          <b>
            Order #${esc(data.id)}
          </b>

          <p>
            Status:
            <b>
              ${esc(
                data.status ||
                "pending"
              )}
            </b>
          </p>

          <p>
            Total:
            ${money(data.total)}
          </p>

          <p>
            ${
              data.created_at
                ? new Date(
                    data.created_at
                  ).toLocaleString(
                    "en-IN"
                  )
                : ""
            }
          </p>

        </div>

      `;

    }else{

      $("trackResult").innerHTML = `

        <div class="empty">
          ${esc(
            data.error ||
            "Order not found"
          )}
        </div>

      `;

    }

  }catch(error){

    $("trackResult").innerHTML = `

      <div class="empty">
        Unable to track order.
      </div>

    `;

  }

}


/* MODAL */

function closeModal(id){

  $(id).style.display =
    "none";

}


/* START */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    $("search")
      .addEventListener(
        "input",
        renderProducts
      );

    updateCartCount();

    loadProducts();

  }
);

</script>
