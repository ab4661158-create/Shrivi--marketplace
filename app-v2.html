<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Shrivi V2</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--accent:#ff6a00;--line:#e5e7eb;--dark:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}button,input{font:inherit}button{border:0;cursor:pointer}.top{position:sticky;top:0;z-index:20;background:rgba(17,24,39,.97);color:#fff;padding:12px 14px 10px}.bar{display:flex;align-items:center;gap:10px}.logo{font-weight:900;font-size:24px;letter-spacing:.4px}.cart{margin-left:auto;background:#fff;color:#111827;border-radius:12px;padding:9px 12px;font-weight:800}.search{margin-top:10px;display:flex;background:#fff;border-radius:12px;overflow:hidden}.search input{border:0;outline:0;flex:1;padding:12px}.search button{background:#ffb000;padding:0 15px;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#374151);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;color:#d1d5db}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.chip{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:999px}.chip.active{background:var(--dark);color:#fff}.section{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.section h2{font-size:19px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #1118270a}.pic{height:175px;background:#eef1f5;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:45px}.body{padding:12px}.name{font-weight:800;line-height:1.25;min-height:40px}.seller{font-size:12px;color:var(--muted);margin:6px 0}.price{font-size:20px;font-weight:900}.old{text-decoration:line-through;color:#9ca3af;font-size:13px;margin-left:5px}.off{color:#07833f;font-size:12px;font-weight:800}.stock{font-size:12px;margin:6px 0;color:#6b7280}.actions{display:flex;gap:7px}.add,.buy{flex:1;padding:10px;border-radius:10px;font-weight:800}.add{background:#ffe08a}.buy{background:#ff8a00;color:#111}.empty{text-align:center;padding:40px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:30}.nav{background:none;color:#6b7280;font-size:11px}.nav.active{color:#111827;font-weight:900}.nav span{display:block;font-size:21px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:50}.sheet{background:#fff;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;width:100%;padding:18px}.close{float:right;background:#eee;border-radius:50%;width:34px;height:34px}.detailImg{height:280px;background:#f1f3f5;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.detailImg img{width:100%;height:100%;object-fit:contain}.qty{display:flex;align-items:center;gap:14px;margin:14px 0}.qty button{width:36px;height:36px;border-radius:10px;background:#eee;font-weight:900}.form input,.form textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0 10px;outline:none}.primary{width:100%;padding:13px;border-radius:12px;background:#ff8a00;font-weight:900}.order{background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:12px;margin:8px 0}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:80}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{max-width:600px;border-radius:22px}.bottom{display:none}}
</style></head>
<body>
<header class="top"><div class="bar"><div class="logo">SHRIVI</div><button class="cart" onclick="openCart()">🛒 <span id="cartCount">0</span></button></div><div class="search"><input id="search" placeholder="Search products, brands & categories"><button onclick="render()">Search</button></div></header>
<main class="wrap">
<section class="hero"><h1>Shop smarter with Shrivi</h1><p>Discover products from trusted sellers at great prices.</p></section>
<div class="chips" id="chips"></div>
<div class="section"><h2>Latest Products</h2><button onclick="loadProducts()">↻ Refresh</button></div>
<div id="products" class="grid"></div>
</main>
<nav class="bottom"><button class="nav active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>⌂</span>Home</button><button class="nav" onclick="document.getElementById('search').focus()"><span>⌕</span>Search</button><button class="nav" onclick="openCart()"><span>🛒</span>Cart</button><button class="nav" onclick="openTrack()"><span>📦</span>Orders</button></nav>
<div id="detail" class="modal" onclick="if(event.target.id==='detail')closeModal('detail')"><div class="sheet"><button class="close" onclick="closeModal('detail')">×</button><div id="detailBody"></div></div></div>
<div id="cart" class="modal" onclick="if(event.target.id==='cart')closeModal('cart')"><div class="sheet"><button class="close" onclick="closeModal('cart')">×</button><h2>🛒 Your Cart</h2><div id="cartBody"></div></div></div>
<div id="checkout" class="modal"><div class="sheet"><button class="close" onclick="closeModal('checkout')">×</button><h2>Checkout</h2><div class="form"><input id="name" placeholder="Customer name"><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><textarea id="address" rows="4" placeholder="Delivery address"></textarea><button class="primary" onclick="placeOrder()">Place Order</button></div></div></div>
<div id="track" class="modal"><div class="sheet"><button class="close" onclick="closeModal('track')">×</button><h2>📦 Track Order</h2><div class="form"><input id="orderId" inputmode="numeric" placeholder="Enter Order ID"><button class="primary" onclick="trackOrder()">Track Order</button></div><div id="trackResult"></div></div></div>
<div id="toast" class="toast"></div>
<script>
let products=[],cart=JSON.parse(localStorage.getItem('shrivi_cart')||'[]'),category='All';
const $=id=>document.getElementById(id); const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function save(){localStorage.setItem('shrivi_cart',JSON.stringify(cart));updateCount()}
function updateCount(){$('cartCount').textContent=cart.reduce((a,x)=>a+Number(x.quantity||0),0)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
async function loadProducts(){try{let r=await fetch('/api/products');if(!r.ok)throw 0;products=await r.json();buildChips();render()}catch(e){$('products').innerHTML='<div class="empty">Unable to load products. Please refresh.</div>'}}
function buildChips(){let cats=['All',...new Set(products.map(p=>p.category).filter(Boolean))];$('chips').innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" onclick="category='${esc(c)}';buildChips();render()">${esc(c)}</button>`).join('')}
function render(){let q=$('search').value.trim().toLowerCase();let list=products.filter(p=>(category==='All'||p.category===category)&&(!q||[p.name,p.category,p.description,p.seller_name].some(v=>String(v||'').toLowerCase().includes(q))));$('products').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No products found.</div>'}
function card(p){let price=Number(p.sale_price??p.price)||0,old=Number(p.original_price??p.price)||0;return `<article class="product"><div class="pic" onclick="openDetail(${p.id})">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<div class="placeholder">🛍️</div>'}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="seller">Sold by ${esc(p.seller_name||'Shrivi')}</div><div class="price">${money(price)} ${old>price?`<span class="old">${money(old)}</span>`:''}</div>${Number(p.discount_percent)>0?`<div class="off">${p.discount_percent}% OFF</div>`:''}<div class="stock">${Number(p.stock)>0?`${p.stock} in stock`:'Out of stock'}</div><div class="actions"><button class="add" onclick="add(${p.id})" ${p.stock<=0?'disabled':''}>Add</button><button class="buy" onclick="buy(${p.id})" ${p.stock<=0?'disabled':''}>Buy Now</button></div></div></article>`}
function find(id){return products.find(p=>Number(p.id)===Number(id))}
function add(id,qty=1){let p=find(id);if(!p||p.stock<1)return toast('Out of stock');let x=cart.find(i=>Number(i.id)===Number(id));let nq=(x?.quantity||0)+qty;if(nq>p.stock)return toast('Stock limit reached');if(x)x.quantity=nq;else cart.push({id:p.id,name:p.name,price:Number(p.sale_price??p.price)||0,image:p.image,seller_name:p.seller_name,quantity:qty});save();toast('Added to cart')}
function buy(id){cart=[];add(id);openCheckout()}
function openDetail(id){let p=find(id);if(!p)return;let price=Number(p.sale_price??p.price)||0;let old=Number(p.original_price??p.price)||0;$('detailBody').innerHTML=`<div class="detailImg">${p.image?`<img src="${esc(p.image)}">`:'<div class="placeholder">🛍️</div>'}</div><h2 style="margin-top:14px">${esc(p.name)}</h2><p class="seller">Sold by ${esc(p.seller_name||'Shrivi')} · ${esc(p.category||'')}</p><div class="price">${money(price)} ${old>price?`<span class="old">${money(old)}</span>`:''}</div><p>${esc(p.description||'Quality product available on Shrivi.')}</p><div class="stock">${p.stock>0?`${p.stock} available`:'Out of stock'}</div><div class="actions"><button class="add" onclick="add(${p.id});closeModal('detail')">Add to Cart</button><button class="buy" onclick="closeModal('detail');buy(${p.id})">Buy Now</button></div>`;$('detail').style.display='flex'}
function openCart(){let total=0;if(!cart.length){$('cartBody').innerHTML='<div class="empty">Your cart is empty.</div>'}else{$('cartBody').innerHTML=cart.map(x=>{let p=find(x.id),price=Number(x.price)||0,total+=price*x.quantity;return `<div class="order"><b>${esc(x.name)}</b><div>${money(price)} × ${x.quantity} = <b>${money(price*x.quantity)}</b></div><div class="qty"><button onclick="change(${x.id},-1)">−</button><b>${x.quantity}</b><button onclick="change(${x.id},1)">+</button><button onclick="removeItem(${x.id})">Remove</button></div></div>`}).join('')+`<h2>Total: ${money(total)}</h2><button class="primary" onclick="openCheckout()">Proceed to Checkout</button>`}$('cart').style.display='flex'}
function change(id,d){let x=cart.find(i=>Number(i.id)===Number(id)),p=find(id);if(!x)return;x.quantity+=d;if(x.quantity<=0)return removeItem(id);if(p&&x.quantity>p.stock)x.quantity=p.stock;save();openCart()}
function removeItem(id){cart=cart.filter(x=>Number(x.id)!==Number(id));save();openCart()}
function openCheckout(){if(!cart.length)return toast('Cart is empty');closeModal('cart');$('checkout').style.display='flex'}
async function placeOrder(){let name=$('name').value.trim(),phone=$('phone').value.trim(),address=$('address').value.trim();if(!name||!/^[0-9]{10}$/.test(phone)||!address)return toast('Enter valid customer details');try{let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:name,customer_phone:phone,customer_address:address,items:cart.map(x=>({id:x.id,quantity:x.quantity}))})});let d=await r.json();if(!r.ok)throw new Error(d.error||'Order failed');cart=[];save();closeModal('checkout');alert(`Order placed successfully!\nOrder ID: ${d.order?.id||d.id||''}`)}catch(e){toast(e.message)}}
function openTrack(){$('track').style.display='flex'}
async function trackOrder(){let id=Number($('orderId').value);if(!Number.isInteger(id)||id<1)return toast('Enter Order ID');let r=await fetch('/api/orders/track/'+id),d=await r.json();$('trackResult').innerHTML=r.ok?`<div class="order"><b>Order #${d.id}</b><p>Status: <b>${esc(d.status)}</b></p><p>Total: ${money(d.total)}</p><p>${new Date(d.created_at).toLocaleString('en-IN')}</p></div>`:`<div class="empty">${esc(d.error||'Order not found')}</div>`}
function closeModal(id){$(id).style.display='none'}
$('search').addEventListener('input',render);updateCount();loadProducts();
</script></body></html>
