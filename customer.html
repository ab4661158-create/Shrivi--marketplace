<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#ffffff"
>

<meta
  name="description"
  content="Shrivi Fashion Marketplace"
>

<link
  rel="manifest"
  href="/manifest.json"
>

<title>Shrivi — Fashion Marketplace</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f7;
  color:#111;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  background:#fff;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  min-height:70px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 16px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
  color:#111;
  text-decoration:none;
}

.search{
  flex:1;
  display:flex;
  gap:8px;
}

.search input{
  width:100%;
  padding:12px 15px;
  border:1px solid #ddd;
  border-radius:25px;
  outline:none;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-weight:700;
  background:#111;
  color:#fff;
}

.btn.light{
  background:#f1f1f1;
  color:#111;
}

.btn.green{
  background:#138a3d;
}

.btn.red{
  background:#d93025;
}

.header-btns{
  display:flex;
  gap:8px;
}

.categories{
  background:#fff;
  border-bottom:1px solid #eee;
  overflow-x:auto;
}

.categories-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  gap:10px;
  padding:10px 16px;
}

.category-btn{
  white-space:nowrap;
  border:1px solid #ddd;
  background:#fff;
  border-radius:20px;
  padding:8px 14px;
}

.category-btn.active{
  background:#111;
  color:#fff;
}

.hero{
  max-width:1200px;
  margin:20px auto;
  padding:45px 25px;
  border-radius:20px;
  background:#111;
  color:#fff;
}

.hero h1{
  font-size:42px;
  margin-bottom:10px;
}

.hero p{
  color:#ddd;
  max-width:600px;
  line-height:1.6;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:0 16px 40px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0 15px;
}

.products{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));
  gap:18px;
}

.card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.product-image{
  width:100%;
  height:240px;
  object-fit:cover;
  background:#eee;
}

.product-body{
  padding:14px;
}

.product-name{
  font-weight:700;
  min-height:42px;
}

.seller{
  font-size:12px;
  color:#777;
  margin:7px 0;
}

.price-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.price{
  font-size:20px;
  font-weight:800;
}

.old-price{
  text-decoration:line-through;
  color:#999;
  font-size:13px;
}

.discount{
  color:#0b8a3b;
  font-size:13px;
  font-weight:700;
}

.stock{
  font-size:12px;
  margin:8px 0;
  color:#555;
}

.card .btn{
  width:100%;
  margin-top:8px;
}

.empty{
  text-align:center;
  padding:50px;
  color:#777;
  background:#fff;
  border-radius:15px;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:500;
  display:none;
}

.overlay.show{
  display:block;
}

.panel{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(450px,100%);
  background:#fff;
  overflow-y:auto;
  padding:20px;
}

.modal{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(560px,94%);
  max-height:92vh;
  overflow-y:auto;
  background:#fff;
  border-radius:18px;
  padding:22px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  border:0;
  background:#eee;
  width:36px;
  height:36px;
  border-radius:50%;
}

.cart-item{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-item img{
  width:70px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.cart-info{
  flex:1;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}

.qty button{
  width:28px;
  height:28px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:6px;
}

.total-box{
  padding:18px 0;
  border-top:1px solid #eee;
  margin-top:15px;
}

.total-line{
  display:flex;
  justify-content:space-between;
  margin:7px 0;
}

.total-line.big{
  font-size:20px;
  font-weight:800;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.payment-option{
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px;
  margin:8px 0;
  display:flex;
  gap:10px;
  align-items:center;
}

.payment-option.selected{
  border:2px solid #111;
}

.account-box{
  text-align:center;
}

.user-icon{
  font-size:50px;
  margin-bottom:10px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(100px);
  background:#111;
  color:#fff;
  padding:13px 18px;
  border-radius:10px;
  z-index:1000;
  transition:.3s;
  opacity:0;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

.loading{
  text-align:center;
  padding:40px;
}

.order-card{
  border:1px solid #eee;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}

.order-status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#eee;
  font-size:12px;
  font-weight:700;
}

@media(max-width:700px){
  .header-inner{
    flex-wrap:wrap;
  }

  .logo{
    width:auto;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .header-btns{
    margin-left:auto;
  }

  .hero{
    margin:10px;
  }

  .hero h1{
    font-size:30px;
  }

  .products{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .product-image{
    height:190px;
  }

  .product-body{
    padding:10px;
  }

  .price{
    font-size:17px;
  }

  .header-btns .btn{
    padding:9px 10px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a class="logo" href="/shop">
      SHRIVI
    </a>

    <div class="search">
      <input
        id="searchInput"
        type="search"
        placeholder="Search products..."
      >
    </div>

    <div class="header-btns">

      <button
        class="btn light"
        onclick="openAccount()"
      >
        Account
      </button>

      <button
        class="btn light"
        onclick="location.href='/seller'"
      >
        Sell
      </button>

      <button
        class="btn"
        onclick="openCart()"
      >
        Cart (<span id="cartCount">0</span>)
      </button>

    </div>
  </div>
</header>

<nav class="categories">
  <div class="categories-inner">

    <button
      class="category-btn active"
      onclick="selectCategory('All',this)"
    >
      All
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('Fashion',this)"
    >
      Fashion
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('Jewellery',this)"
    >
      Jewellery
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('Co-ord Sets',this)"
    >
      Co-ord Sets
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('Accessories',this)"
    >
      Accessories
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('Electronics',this)"
    >
      Electronics
    </button>

  </div>
</nav>

<section class="hero">
  <h1>Discover Your Style.</h1>

  <p>
    Shop fashion, jewellery and accessories
    from independent sellers on Shrivi.
  </p>
</section>

<main class="container">

  <div class="section-title">
    <h2>Products</h2>
    <span id="productCount"></span>
  </div>

  <div id="products" class="products">
    <div class="loading">
      Loading products...
    </div>
  </div>

</main>

<!-- CART -->

<div id="cartOverlay" class="overlay">

  <div class="panel">

    <div class="modal-header">
      <h2>Your Cart</h2>

      <button
        class="close"
        onclick="closeCart()"
      >
        ×
      </button>
    </div>

    <div id="cartItems"></div>

    <div class="total-box">

      <div class="total-line">
        <span>Subtotal</span>
        <strong id="cartSubtotal">₹0</strong>
      </div>

      <div class="total-line big">
        <span>Total</span>
        <strong id="cartTotal">₹0</strong>
      </div>

      <button
        class="btn"
        style="width:100%;margin-top:10px"
        onclick="openCheckout()"
      >
        Proceed to Checkout
      </button>

    </div>

  </div>
</div>

<!-- ACCOUNT -->

<div id="accountOverlay" class="overlay">

  <div class="modal">

    <div class="modal-header">

      <h2>Account</h2>

      <button
        class="close"
        onclick="closeAccount()"
      >
        ×
      </button>

    </div>

    <div id="accountContent"></div>

  </div>
</div>

<!-- CHECKOUT -->

<div id="checkoutOverlay" class="overlay">

  <div class="modal">

    <div class="modal-header">

      <h2>Checkout</h2>

      <button
        class="close"
        onclick="closeCheckout()"
      >
        ×
      </button>

    </div>

    <div id="checkoutLoginWarning"
         style="display:none">
      Please login before checkout.
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <input
        id="customerName"
        placeholder="Your name"
      >
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input
        id="customerPhone"
        inputmode="numeric"
        maxlength="10"
        placeholder="10 digit mobile number"
      >
    </div>

    <div class="form-group">
      <label>Delivery Address</label>
      <textarea
        id="customerAddress"
        placeholder="Enter complete delivery address"
      ></textarea>
    </div>

    <h3 style="margin:18px 0 10px">
      Payment Method
    </h3>

    <label
      id="codOption"
      class="payment-option selected"
    >
      <input
        type="radio"
        name="payment"
        value="cod"
        checked
        onchange="selectPayment('cod')"
      >

      <span>
        <strong>Cash on Delivery</strong><br>
        Pay when your order arrives.
      </span>
    </label>

    <label
      id="razorpayOption"
      class="payment-option"
    >
      <input
        type="radio"
        name="payment"
        value="razorpay"
        onchange="selectPayment('razorpay')"
      >

      <span>
        <strong>Pay Online</strong><br>
        UPI, Cards, Net Banking & Wallets
      </span>
    </label>

    <div class="total-box">

      <div class="total-line">
        <span>Order Total</span>
        <strong id="checkoutTotal">
          ₹0
        </strong>
      </div>

      <button
        id="placeOrderBtn"
        class="btn"
        style="width:100%;margin-top:12px"
        onclick="placeOrder()"
      >
        Place Order
      </button>

    </div>

  </div>
</div>

<!-- TOAST -->

<div id="toast" class="toast"></div>

<script>
const CART_KEY = "shrivi_cart";

let products = [];
let cart = loadCart();
let selectedCategory = "All";
let currentUser = null;
let selectedPayment = "cod";
let processingPayment = false;

// =====================================================
// UTILITIES
// =====================================================

function money(value){
  return "₹" + Number(value || 0)
    .toLocaleString("en-IN",{
      maximumFractionDigits:2
    });
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message){
  const el =
    document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  setTimeout(() => {
    el.classList.remove("show");
  },3000);
}

function imageFallback(){
  return "data:image/svg+xml," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="500"
           height="500">
        <rect width="100%" height="100%"
              fill="#eeeeee"/>
        <text x="50%" y="50%"
              dominant-baseline="middle"
              text-anchor="middle"
              font-size="28"
              fill="#888">
          SHRIVI
        </text>
      </svg>
    `);
}

// =====================================================
// CART
// =====================================================

function loadCart(){
  try{
    const saved =
      localStorage.getItem(CART_KEY);

    const parsed =
      saved ? JSON.parse(saved) : [];

    return Array.isArray(parsed)
      ? parsed
      : [];
  }catch{
    return [];
  }
}

function saveCart(){
  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  updateCartCount();
}

function updateCartCount(){
  const count =
    cart.reduce(
      (sum,item) =>
        sum + Number(item.quantity || 0),
      0
    );

  document.getElementById(
    "cartCount"
  ).textContent = count;
}

function addToCart(id){
  const product =
    products.find(
      p => Number(p.id) === Number(id)
    );

  if(!product){
    toast("Product not found");
    return;
  }

  if(Number(product.stock) <= 0){
    toast("Product is out of stock");
    return;
  }

  const existing =
    cart.find(
      item =>
        Number(item.id) === Number(id)
    );

  if(existing){

    if(
      existing.quantity >=
      Number(product.stock)
    ){
      toast("Maximum available stock reached");
      return;
    }

    existing.quantity++;

  }else{

    cart.push({
      id:Number(product.id),
      name:product.name,
      image:product.image || "",
      price:Number(product.sale_price || product.price || 0),
      original_price:Number(product.original_price || product.price || 0),
      quantity:1,
      stock:Number(product.stock || 0),
      seller_id:product.seller_id
    });

  }

  saveCart();
  renderCart();
  toast("Added to cart");
}

function changeQuantity(id,delta){

  const item =
    cart.find(
      x => Number(x.id) === Number(id)
    );

  if(!item) return;

  const product =
    products.find(
      p => Number(p.id) === Number(id)
    );

  const stock =
    Number(
      product?.stock ??
      item.stock ??
      0
    );

  item.quantity += delta;

  if(item.quantity <= 0){
    cart =
      cart.filter(
        x => Number(x.id) !== Number(id)
      );
  }else if(item.quantity > stock){
    item.quantity = stock;
    toast("Maximum stock available is " + stock);
  }

  saveCart();
  renderCart();
}

function removeFromCart(id){

  cart =
    cart.filter(
      x => Number(x.id) !== Number(id)
    );

  saveCart();
  renderCart();
}

function getCartTotal(){

  return cart.reduce(
    (sum,item) =>
      sum +
      Number(item.price || 0) *
      Number(item.quantity || 0),
    0
  );
}

// =====================================================
// PRODUCTS
// =====================================================

async function loadProducts(){

  const container =
    document.getElementById("products");

  try{

    const response =
      await fetch("/api/products");

    if(!response.ok){
      throw new Error(
        "Unable to load products"
      );
    }

    products =
      await response.json();

    renderProducts();

  }catch(error){

    container.innerHTML = `
      <div class="empty">
        Unable to load products.<br><br>
        Please refresh the page.
      </div>
    `;

    toast("Failed to load products");
  }
}

function renderProducts(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();

  const filtered =
    products.filter(product => {

      const categoryOk =
        selectedCategory === "All" ||
        String(product.category || "")
          .toLowerCase() ===
        selectedCategory.toLowerCase();

      const searchOk =
        !search ||
        String(product.name || "")
          .toLowerCase()
          .includes(search) ||
        String(product.category || "")
          .toLowerCase()
          .includes(search) ||
        String(product.description || "")
          .toLowerCase()
          .includes(search);

      return categoryOk && searchOk;
    });

  document.getElementById(
    "productCount"
  ).textContent =
    `${filtered.length} product(s)`;

  const container =
    document.getElementById(
      "products"
    );

  if(!filtered.length){

    container.innerHTML = `
      <div class="empty">
        No products found.
      </div>
    `;

    return;
  }

  container.innerHTML =
    filtered.map(product => {

      const price =
        Number(
          product.sale_price ??
          product.price ??
          0
        );

      const original =
        Number(
          product.original_price ??
          product.price ??
          0
        );

      const discount =
        Number(
          product.discount_percent || 0
        );

      const stock =
        Number(product.stock || 0);

      return `
        <article class="card">

          <img
            class="product-image"
            src="${escapeHtml(
              product.image || imageFallback()
            )}"
            onerror="this.src='${imageFallback()}'"
            alt="${escapeHtml(product.name)}"
          >

          <div class="product-body">

            <div class="product-name">
              ${escapeHtml(product.name)}
            </div>

            <div class="seller">
              Seller:
              ${escapeHtml(
                product.seller_name ||
                "Shrivi"
              )}
            </div>

            <div class="price-row">

              <span class="price">
                ${money(price)}
              </span>

              ${
                discount > 0
                ? `
                  <span class="old-price">
                    ${money(original)}
                  </span>

                  <span class="discount">
                    ${discount}% OFF
                  </span>
                `
                : ""
              }

            </div>

            <div class="stock">
              ${
                stock > 0
                  ? `${stock} available`
                  : "Out of stock"
              }
            </div>

            <button
              class="btn"
              ${
                stock <= 0
                  ? "disabled"
                  : ""
              }
              onclick="addToCart(${Number(product.id)})"
            >
              ${
                stock > 0
                  ? "Add to Cart"
                  : "Out of Stock"
              }
            </button>

          </div>
        </article>
      `;
    }).join("");
}

function selectCategory(category,button){

  selectedCategory = category;

  document
    .querySelectorAll(".category-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  renderProducts();
}

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderProducts
  );

// =====================================================
// CART UI
// =====================================================

function openCart(){

  renderCart();

  document
    .getElementById("cartOverlay")
    .classList.add("show");
}

function closeCart(){

  document
    .getElementById("cartOverlay")
    .classList.remove("show");
}

function renderCart(){

  const container =
    document.getElementById(
      "cartItems"
    );

  updateCartCount();

  if(!cart.length){

    container.innerHTML = `
      <div class="empty">
        Your cart is empty.
      </div>
    `;

  }else{

    container.innerHTML =
      cart.map(item => `

        <div class="cart-item">

          <img
            src="${escapeHtml(
              item.image || imageFallback()
            )}"
            onerror="this.src='${imageFallback()}'"
          >

          <div class="cart-info">

            <strong>
              ${escapeHtml(item.name)}
            </strong>

            <div style="margin-top:5px">
              ${money(item.price)}
            </div>

            <div class="qty">

              <button
                onclick="changeQuantity(${Number(item.id)},-1)"
              >
                −
              </button>

              <span>
                ${Number(item.quantity)}
              </span>

              <button
                onclick="changeQuantity(${Number(item.id)},1)"
              >
                +
              </button>

              <button
                class="btn red"
                style="padding:5px 9px"
                onclick="removeFromCart(${Number(item.id)})"
              >
                Remove
              </button>

            </div>

          </div>

        </div>
      `).join("");
  }

  const total =
    getCartTotal();

  document.getElementById(
    "cartSubtotal"
  ).textContent =
    money(total);

  document.getElementById(
    "cartTotal"
  ).textContent =
    money(total);
}

// =====================================================
// ACCOUNT
// =====================================================

async function loadCurrentUser(){

  try{

    const response =
      await fetch(
        "/api/customer/me",
        {
          credentials:"same-origin"
        }
      );

    const data =
      await response.json();

    currentUser =
      data.loggedIn
        ? data.customer
        : null;

  }catch{

    currentUser = null;
  }
}

function openAccount(){

  renderAccount();

  document
    .getElementById("accountOverlay")
    .classList.add("show");
}

function closeAccount(){

  document
    .getElementById("accountOverlay")
    .classList.remove("show");
}

function renderAccount(){

  const box =
    document.getElementById(
      "accountContent"
    );

  if(currentUser){

    box.innerHTML = `

      <div class="account-box">

        <div class="user-icon">
          👤
        </div>

        <h2>
          ${escapeHtml(currentUser.name)}
        </h2>

        <p style="margin:8px 0;color:#666">
          ${escapeHtml(currentUser.email)}
        </p>

        <p style="margin-bottom:20px">
          ${escapeHtml(currentUser.phone || "")}
        </p>

        <button
          class="btn"
          style="width:100%;margin-bottom:8px"
          onclick="showOrders()"
        >
          My Orders
        </button>

        <button
          class="btn red"
          style="width:100%"
          onclick="logoutCustomer()"
        >
          Logout
        </button>

      </div>

      <div
        id="ordersArea"
        style="margin-top:20px"
      ></div>
    `;

  }else{

    box.innerHTML = `

      <div id="loginForm">

        <h3 style="margin-bottom:15px">
          Login
        </h3>

        <div class="form-group">
          <label>Email</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="Email"
          >
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="Password"
          >
        </div>

        <button
          class="btn"
          style="width:100%"
          onclick="loginCustomer()"
        >
          Login
        </button>

        <p
          style="text-align:center;margin:15px 0"
        >
          New customer?
        </p>

        <button
          class="btn light"
          style="width:100%"
          onclick="showRegister()"
        >
          Create Account
        </button>

      </div>
    `;
  }
}

function showRegister(){

  document.getElementById(
    "accountContent"
  ).innerHTML = `

    <h3 style="margin-bottom:15px">
      Create Account
    </h3>

    <div class="form-group">
      <label>Name</label>
      <input
        id="registerName"
        placeholder="Full name"
      >
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        id="registerEmail"
        type="email"
        placeholder="Email"
      >
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input
        id="registerPhone"
        maxlength="10"
        inputmode="numeric"
        placeholder="10 digit mobile"
      >
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        id="registerPassword"
        type="password"
        placeholder="Minimum 8 characters"
      >
    </div>

    <button
      class="btn"
      style="width:100%"
      onclick="registerCustomer()"
    >
      Create Account
    </button>

    <button
      class="btn light"
      style="width:100%;margin-top:8px"
      onclick="renderAccount()"
    >
      Back to Login
    </button>
  `;
}

async function loginCustomer(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  try{

    const response =
      await fetch(
        "/api/customer/login",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            email,
            password
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){
      throw new Error(
        data.error || "Login failed"
      );
    }

    currentUser =
      data.customer;

    toast("Login successful");

    renderAccount();

  }catch(error){

    toast(error.message);
  }
}

async function registerCustomer(){

  const name =
    document.getElementById(
      "registerName"
    ).value.trim();

  const email =
    document.getElementById(
      "registerEmail"
    ).value.trim();

  const phone =
    document.getElementById(
      "registerPhone"
    ).value.trim();

  const password =
    document.getElementById(
      "registerPassword"
    ).value;

  try{

    const response =
      await fetch(
        "/api/customer/register",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            name,
            email,
            phone,
            password
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){
      throw new Error(
        data.error ||
        "Registration failed"
      );
    }

    currentUser =
      data.customer;

    toast(
      "Account created successfully"
    );

    renderAccount();

  }catch(error){

    toast(error.message);
  }
}

async function logoutCustomer(){

  try{

    await fetch(
      "/api/customer/logout",
      {
        method:"POST"
      }
    );

    currentUser = null;

    renderAccount();

    toast("Logged out");

  }catch{

    toast("Logout failed");
  }
}

// =====================================================
// ORDERS
// =====================================================

async function showOrders(){

  const area =
    document.getElementById(
      "ordersArea"
    );

  if(!area) return;

  area.innerHTML =
    `<div class="loading">Loading orders...</div>`;

  try{

    const response =
      await fetch(
        "/api/customer/orders"
      );

    const orders =
      await response.json();

    if(!orders.length){

      area.innerHTML = `
        <div class="empty">
          No orders yet.
        </div>
      `;

      return;
    }

    area.innerHTML =
      orders.map(order => `

        <div class="order-card">

          <div style="
            display:flex;
            justify-content:space-between;
            gap:10px;
            margin-bottom:8px
          ">

            <strong>
              Order #${Number(order.id)}
            </strong>

            <span class="order-status">
              ${escapeHtml(order.status)}
            </span>

          </div>

          <div style="font-size:13px;color:#666">
            Payment:
            ${escapeHtml(
              order.payment_method || "cod"
            )}
          </div>

          <div style="margin-top:8px">
            Total:
            <strong>
              ${money(order.total)}
            </strong>
          </div>

          <div style="margin-top:8px">
            ${Array.isArray(order.items)
              ? order.items.map(
                  item =>
                    `<div>
                      ${escapeHtml(item.name)}
                      × ${Number(item.quantity)}
                    </div>`
                ).join("")
              : ""
            }
          </div>

        </div>
      `).join("");

  }catch{

    area.innerHTML = `
      <div class="empty">
        Unable to load orders.
      </div>
    `;
  }
}

// =====================================================
// CHECKOUT
// =====================================================

function openCheckout(){

  if(!cart.length){
    toast("Your cart is empty");
    return;
  }

  if(!currentUser){

    toast(
      "Please login before checkout"
    );

    openAccount();

    return;
  }

  document.getElementById(
    "customerName"
  ).value =
    currentUser.name || "";

  document.getElementById(
    "customerPhone"
  ).value =
    currentUser.phone || "";

  document.getElementById(
    "checkoutTotal"
  ).textContent =
    money(getCartTotal());

  selectPayment("cod");

  document
    .getElementById(
      "checkoutOverlay"
    )
    .classList.add("show");
}

function closeCheckout(){

  document
    .getElementById(
      "checkoutOverlay"
    )
    .classList.remove("show");
}

function selectPayment(method){

  selectedPayment = method;

  document
    .getElementById("codOption")
    .classList.toggle(
      "selected",
      method === "cod"
    );

  document
    .getElementById("razorpayOption")
    .classList.toggle(
      "selected",
      method === "razorpay"
    );

  document
    .querySelector(
      `input[name="payment"][value="${method}"]`
    ).checked = true;

  document.getElementById(
    "placeOrderBtn"
  ).textContent =
    method === "razorpay"
      ? "Pay Online"
      : "Place Order";
}

// =====================================================
// PAYMENT
// =====================================================

async function createRazorpayOrder(){

  const amount =
    getCartTotal();

  const response =
    await fetch(
      "/api/payment/create-order",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          amount
        })
      }
    );

  const data =
    await response.json();

  if(!response.ok){
    throw new Error(
      data.error ||
      "Unable to start payment"
    );
  }

  return data;
}

async function verifyPayment(
  paymentResponse
){

  const response =
    await fetch(
      "/api/payment/verify",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          razorpay_order_id:
            paymentResponse.razorpay_order_id,

          razorpay_payment_id:
            paymentResponse.razorpay_payment_id,

          razorpay_signature:
            paymentResponse.razorpay_signature
        })
      }
    );

  const data =
    await response.json();

  if(!response.ok || !data.verified){
    throw new Error(
      data.error ||
      "Payment verification failed"
    );
  }

  return data;
}

async function placeOrder(){

  if(processingPayment) return;

  if(!currentUser){

    toast(
      "Please login before checkout"
    );

    return;
  }

  if(!cart.length){

    toast(
      "Your cart is empty"
    );

    return;
  }

  const name =
    document.getElementById(
      "customerName"
    ).value.trim();

  const phone =
    document.getElementById(
      "customerPhone"
    ).value.trim();

  const address =
    document.getElementById(
      "customerAddress"
    ).value.trim();

  if(!name){
    toast("Enter your name");
    return;
  }

  if(
    phone &&
    !/^[0-9]{10}$/.test(phone)
  ){
    toast("Enter valid 10 digit phone");
    return;
  }

  if(!address){
    toast(
      "Enter delivery address"
    );
    return;
  }

  processingPayment = true;

  const button =
    document.getElementById(
      "placeOrderBtn"
    );

  button.disabled = true;
  button.textContent =
    selectedPayment === "razorpay"
      ? "Opening Payment..."
      : "Placing Order...";

  try{

    let paymentId = null;
    let razorpayOrderId = null;

    // ==========================================
    // RAZORPAY
    // ==========================================

    if(
      selectedPayment ===
      "razorpay"
    ){

      const paymentOrder =
        await createRazorpayOrder();

      razorpayOrderId =
        paymentOrder.order.id;

      await new Promise(
        (resolve,reject) => {

          if(
            typeof Razorpay ===
            "undefined"
          ){
            reject(
              new Error(
                "Razorpay Checkout failed to load"
              )
            );

            return;
          }

          const options = {

            key:
              paymentOrder.key,

            amount:
              paymentOrder.order.amount,

            currency:
              paymentOrder.order.currency,

            name:
              "SHRIVI",

            description:
              "Shrivi Marketplace Order",

            order_id:
              paymentOrder.order.id,

            prefill:{
              name,
              email:
                currentUser.email || "",
              contact:
                phone || ""
            },

            theme:{
              color:"#111111"
            },

            handler:
              async function(response){

                try{

                  button.textContent =
                    "Verifying Payment...";

                  await verifyPayment(
                    response
                  );

                  paymentId =
                    response.razorpay_payment_id;

                  resolve();

                }catch(error){

                  reject(error);
                }
              },

            modal:{
              ondismiss:function(){

                reject(
                  new Error(
                    "Payment cancelled"
                  )
                );
              }
            }
          };

          const checkout =
            new Razorpay(
              options
            );

          checkout.on(
            "payment.failed",
            function(response){

              reject(
                new Error(
                  response.error?.description ||
                  "Payment failed"
                )
              );
            }
          );

          checkout.open();
        }
      );
    }

    // ==========================================
    // CREATE FINAL ORDER
    // ==========================================

    button.textContent =
      "Creating Order...";

    const orderResponse =
      await fetch(
        "/api/customer/orders",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            items:
              cart.map(item => ({
                id:
                  Number(item.id),

                quantity:
                  Number(item.quantity)
              })),

            customer_name:
              name,

            customer_phone:
              phone,

            customer_address:
              address,

            payment_method:
              selectedPayment,

            payment_id:
              paymentId,

            razorpay_order_id:
              razorpayOrderId
          })
        }
      );

    const orderData =
      await orderResponse.json();

    if(!orderResponse.ok){

      throw new Error(
        orderData.error ||
        "Unable to create order"
      );
    }

    // ==========================================
    // SUCCESS
    // ==========================================

    cart = [];

    saveCart();

    closeCheckout();

    closeCart();

    toast(
      selectedPayment === "razorpay"
        ? "Payment successful! Order placed."
        : "Order placed successfully!"
    );

    await loadProducts();

    setTimeout(() => {

      openAccount();

      setTimeout(
        showOrders,
        200
      );

    },700);

  }catch(error){

    toast(
      error.message ||
      "Checkout failed"
    );

  }finally{

    processingPayment = false;

    button.disabled = false;

    button.textContent =
      selectedPayment === "razorpay"
        ? "Pay Online"
        : "Place Order";
  }
}

// =====================================================
// INIT
// =====================================================

async function init(){

  updateCartCount();

  await Promise.all([
    loadProducts(),
    loadCurrentUser()
  ]);

  renderCart();
}

init();
</script>
