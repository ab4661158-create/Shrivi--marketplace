<!DOCTYPE html>
<html lang="en">
<link rel="manifest" href="/manifest.json">
    <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shrivi Marketplace</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#222;
}

button,input,select{
    font:inherit;
}

header{
    background:#111827;
    color:white;
    position:sticky;
    top:0;
    z-index:100;
}

.navbar{
    max-width:1400px;
    margin:auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    white-space:nowrap;
}

.search-box{
    flex:1;
    display:flex;
    max-width:700px;
}

.search-box input{
    width:100%;
    padding:12px 15px;
    border:none;
    outline:none;
    border-radius:8px 0 0 8px;
}

.search-box button{
    border:none;
    background:#f59e0b;
    padding:0 20px;
    cursor:pointer;
    border-radius:0 8px 8px 0;
    font-weight:bold;
}

.nav-btn{
    background:transparent;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
    white-space:nowrap;
}

.cart-btn{
    background:#f59e0b;
    color:#111;
    padding:10px 15px;
    border-radius:8px;
}

.categories{
    background:white;
    border-bottom:1px solid #ddd;
    overflow-x:auto;
}

.categories-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    gap:10px;
    padding:12px 20px;
}

.category-btn{
    border:1px solid #ddd;
    background:white;
    padding:9px 16px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
}

.category-btn:hover{
    background:#111827;
    color:white;
}

.hero{
    max-width:1400px;
    margin:20px auto;
    padding:45px 30px;
    border-radius:16px;
    background:linear-gradient(135deg,#111827,#374151);
    color:white;
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    font-size:18px;
    color:#ddd;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:0 20px 40px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 18px;
    gap:10px;
}

.section-head h2{
    font-size:25px;
}

.sort{
    padding:9px;
    border:1px solid #ccc;
    border-radius:7px;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.product-card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.product-image{
    width:100%;
    height:260px;
