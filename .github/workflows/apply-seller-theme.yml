name: Apply Seller Premium Theme

on:
  push:
    branches: [main, safe-gallery-fix-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Upgrade seller center safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('seller.html')
          if not p.exists():
              raise SystemExit('seller.html is missing')
          s = p.read_text(encoding='utf-8')

          css_marker = '/* SHRIVI SELLER PREMIUM THEME V2 */'
          if css_marker not in s:
              css = r'''
/* SHRIVI SELLER PREMIUM THEME V2 */
:root{--seller-bg:#f6f7fb;--seller-card:#fff;--seller-ink:#172033;--seller-muted:#667085;--seller-line:#e4e7ec;--seller-blue:#1463ff;--seller-cyan:#00a8e1}
body{background:var(--seller-bg);color:var(--seller-ink)}
header{background:linear-gradient(135deg,#111827 0%,#172554 58%,#075985 100%);box-shadow:0 6px 24px rgba(15,23,42,.18)}
.brand-icon{background:linear-gradient(135deg,#1463ff,#00a8e1);box-shadow:0 7px 18px rgba(20,99,255,.25)}
.container{padding-top:24px}
.card,.stat-card,.product-card,.order-card{border:1px solid var(--seller-line);box-shadow:0 5px 18px rgba(16,24,40,.06);border-radius:12px}
.card{padding:22px}
input,textarea,select{border-color:#cfd4dc;border-radius:8px}
input:focus,textarea:focus,select:focus{border-color:var(--seller-blue);box-shadow:0 0 0 3px rgba(20,99,255,.12)}
.tabs{gap:6px;padding:6px;background:#eef2f7;border:0;border-radius:12px}
.tab{background:transparent;border:0;border-radius:8px;padding:12px 17px;color:#475467}
.tab.active{background:#172033;color:#fff;box-shadow:0 4px 12px rgba(15,23,42,.16)}
.product-card{transition:transform .18s ease,box-shadow .18s ease}
.product-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(16,24,40,.11)}
.product-image{background:#f2f4f7}
.image-upload-box{border-color:#b7c4d8;background:#f8fafc;border-radius:10px}
.image-upload-label{background:linear-gradient(135deg,#1463ff,#00a8e1);color:#fff}
.modal{background:rgba(15,23,42,.68)}
.modal-box{border:1px solid #dfe4ea;border-radius:14px;box-shadow:0 24px 70px rgba(15,23,42,.28)}
'''
              s = s.replace('</style>', css + '\n</style>', 1)

          js_marker = '/* SHRIVI SELLER LISTING TOOLS V2 */'
          if js_marker not in s:
              js = r'''
<script>
/* SHRIVI SELLER LISTING TOOLS V2 */
(function(){
  const esc = window.escapeHtml || (v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'));
  function quality(p){let score=0;if(p.name)score+=25;if(p.image)score+=25;if(p.description&&String(p.description).length>=30)score+=20;if(p.category)score+=15;if(Number(p.price)>0)score+=10;if(Number(p.stock)>=0)score+=5;return score}
  function enhanceProducts(){
    const tab=document.getElementById('productsTab'),grid=document.getElementById('productsGrid');
    if(!tab||!grid||document.getElementById('sellerListingToolbar'))return;
    const toolbar=document.createElement('div');toolbar.className='seller-toolbar';toolbar.id='sellerListingToolbar';
    toolbar.innerHTML='<input id="sellerProductSearch" placeholder="🔎 Search your listings..."><select id="sellerStockFilter" class="seller-filter"><option value="all">All stock</option><option value="live">In stock</option><option value="low">Low stock</option><option value="out">Out of stock</option></select><select id="sellerSort" class="seller-filter"><option value="new">Newest</option><option value="name">Name A–Z</option><option value="priceHigh">Price high–low</option><option value="stockLow">Stock low–high</option></select>';
    const firstCard=tab.querySelector('.card');if(firstCard)firstCard.appendChild(toolbar);
    ['sellerProductSearch','sellerStockFilter','sellerSort'].forEach(id=>document.getElementById(id)?.addEventListener('input',filterListings));
  }
  function filterListings(){
    const q=(document.getElementById('sellerProductSearch')?.value||'').toLowerCase().trim(),sf=document.getElementById('sellerStockFilter')?.value||'all',sort=document.getElementById('sellerSort')?.value||'new';
    let arr=[...(window.currentProducts||[])].filter(p=>{const stock=Number(p.stock||0),text=`${p.name||''} ${p.category||''} ${p.description||''}`.toLowerCase();return text.includes(q)&&(sf==='all'||(sf==='live'&&stock>5)||(sf==='low'&&stock>0&&stock<=5)||(sf==='out'&&stock<=0))});
    arr.sort((a,b)=>sort==='name'?String(a.name||'').localeCompare(String(b.name||'')):sort==='priceHigh'?Number(b.price||0)-Number(a.price||0):sort==='stockLow'?Number(a.stock||0)-Number(b.stock||0):Number(b.id||0)-Number(a.id||0));
    renderEnhancedProducts(arr);
  }
  function renderEnhancedProducts(arr){
    const grid=document.getElementById('productsGrid');if(!grid)return;
    if(!arr.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>No matching listings</h3><p>Try another search or stock filter.</p></div>';return}
    grid.innerHTML=arr.map(p=>{const image=p.image||'https://via.placeholder.com/600x400?text=Shrivi',price=Number(p.price||0),sale=Number(p.sale_price??(price-price*Number(p.discount_percent||0)/100)),stock=Number(p.stock||0),q=quality(p),cls=stock<=0?'listing-out':stock<=5?'listing-low':'listing-live',label=stock<=0?'● Out of stock':stock<=5?'● Low stock':'● Active listing',discount=Number(p.discount_percent||0);return `<article class="product-card"><img class="product-image" src="${esc(image)}" alt="${esc(p.name||'Product')}" onerror="this.src='https://via.placeholder.com/600x400?text=Shrivi'"><div class="product-content"><div class="product-title">${esc(p.name||'-')}</div><div class="product-category">${esc(p.category||'Uncategorized')}</div><div class="listing-badge ${cls}">${label}</div><div class="product-price">₹${sale.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>${discount>0?`<div class="old-price">₹${price.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="discount">${discount}% OFF</div>`:''}<div class="listing-meta"><span>Stock: <b>${stock}</b></span><span>•</span><span>Listing quality: <b>${q}%</b></span></div><div class="listing-quality"><span style="width:${q}%"></span></div><div class="product-actions"><button class="btn warning" onclick="editProduct(${Number(p.id)})">Edit</button><button class="btn danger" onclick="deleteProduct(${Number(p.id)})">Delete</button></div></div></article>`}).join('')
  }
  function addInsights(){const d=document.getElementById('dashboardTab');if(!d||document.getElementById('sellerInsights'))return;const box=document.createElement('div');box.id='sellerInsights';box.className='seller-insight';box.innerHTML='<div class="insight"><b id="activeListingCount">0</b><small>Active listings</small></div><div class="insight"><b id="lowStockCount">0</b><small>Low-stock products</small></div><div class="insight"><b id="listingQualityAvg">0%</b><small>Average listing quality</small></div>';const stats=d.querySelector('.stats');if(stats&&stats.parentNode)stats.parentNode.insertBefore(box,stats)}
  function refreshInsights(){const ps=window.currentProducts||[];let active=0,low=0,total=0;ps.forEach(p=>{const s=Number(p.stock||0);if(s>0)active++;if(s>0&&s<=5)low++;total+=quality(p)});document.getElementById('activeListingCount')?.replaceChildren(String(active));document.getElementById('lowStockCount')?.replaceChildren(String(low));document.getElementById('listingQualityAvg')?.replaceChildren(ps.length?Math.round(total/ps.length)+'%':'0%')}
  const originalRender=window.renderProducts;if(typeof originalRender==='function')window.renderProducts=function(){originalRender.apply(this,arguments);enhanceProducts();setTimeout(()=>{filterListings();refreshInsights()},0)};
  const originalShowTab=window.showTab;if(typeof originalShowTab==='function')window.showTab=function(tab){originalShowTab.apply(this,arguments);if(tab==='products')setTimeout(enhanceProducts,20)};
  const originalRefresh=window.refreshAll;if(typeof originalRefresh==='function')window.refreshAll=async function(){const r=await originalRefresh.apply(this,arguments);refreshInsights();return r};
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{enhanceProducts();addInsights()},300));
})();
</script>
'''
              s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify seller theme before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('seller.html').read_text(encoding='utf-8')
          required = [
            'SHRIVI SELLER PREMIUM THEME V2',
            'SHRIVI SELLER LISTING TOOLS V2',
            'sellerListingToolbar',
            'productsGrid',
            'dashboardTab',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Verification failed; missing: ' + ', '.join(missing))
          if '</style>' not in s or '</body>' not in s:
              raise SystemExit('Verification failed; seller.html structure is incomplete')
          if s.count('SHRIVI SELLER PREMIUM THEME V2') != 1:
              raise SystemExit('Verification failed; duplicate theme marker')
          if s.count('SHRIVI SELLER LISTING TOOLS V2') != 1:
              raise SystemExit('Verification failed; duplicate listing marker')
          print('SELLER THEME VERIFICATION: PASS')
          print('Required markers: PASS')
          print('HTML structure markers: PASS')
          print('Duplicate-marker check: PASS')
          PY

      - name: Commit seller upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seller.html
          if git diff --cached --quiet; then
            echo "No seller changes needed"
            exit 0
          fi
          git commit -m "Upgrade seller listing tools [seller-theme]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
