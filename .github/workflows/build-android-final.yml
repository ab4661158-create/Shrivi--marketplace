name: Build SHRIVI Android APK - Final

on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'resources/**'
      - 'manifest.json'
      - '.github/workflows/build-android-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do not enable Gradle caching here: the Android project is generated
      # later by Capacitor, so setup-java cannot find Gradle files at this point.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/cli @capacitor/core @capacitor/android sharp typescript

      - name: Verify SHRIVI icon and splash sources
        run: |
          test -s resources/icon-source.svg
          test -s resources/icon.png
          test -s resources/splash-source.svg

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Verify generated Android project
        run: |
          test -s android/gradlew
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -d android/app
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SHRIVI debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHRIVI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
