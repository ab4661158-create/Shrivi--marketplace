name: Build SHRIVI Android APK - Final

on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'resources/**'
      - 'manifest.json'
      - '.github/workflows/build-android-final.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor CLI and icon tooling
        run: npm install --no-save @capacitor/cli @capacitor/core @capacitor/android sharp typescript

      - name: Verify SHRIVI icon and splash sources
        run: |
          test -f resources/icon-source.svg
          test -f resources/icon.png
          test -f resources/splash-source.svg

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload SHRIVI debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHRIVI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
