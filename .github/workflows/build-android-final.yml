name: Build SHRIVI Android APK - Final

on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'resources/**'
      - 'manifest.json'
      - 'package.json'
      - '.github/workflows/build-android-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify Java, Node and npm
        run: |
          java -version
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Install Android and branding tooling
        run: npm install --no-save @capacitor/cli @capacitor/core @capacitor/android @capacitor/splash-screen @capacitor/assets sharp typescript

      - name: Verify branding sources
        run: |
          test -s resources/icon-source.svg
          test -s resources/splash-source.svg

      - name: Generate fresh canonical branding PNGs
        run: |
          rm -f resources/icon.png resources/splash.png
          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            await sharp('resources/icon-source.svg').resize(1024, 1024).png().toFile('resources/icon.png');
            await sharp('resources/splash-source.svg').resize(1024, 1024).png().toFile('resources/splash.png');
            for (const file of ['resources/icon.png', 'resources/splash.png']) {
              const m = await sharp(file).metadata();
              if (m.width !== 1024 || m.height !== 1024) throw new Error(`${file}: ${m.width}x${m.height}`);
            }
            console.log('Fresh SHRIVI icon and splash PNGs generated.');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Generate clean native Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Generate fresh native icon and splash
        run: |
          rm -rf android/app/src/main/res/drawable* android/app/src/main/res/mipmap*
          rm -f android/app/src/main/res/values/colors.xml android/app/src/main/res/values/styles.xml android/app/src/main/res/values-v31/styles.xml
          npx capacitor-assets generate --android

      - name: Configure Android 12+ and legacy native splash themes
        run: |
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#7B1FA2</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowBackground">@drawable/splash</item>
              </style>
          </resources>
          EOF
          cat > android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash</item>
                  <item name="android:windowSplashScreenAnimationDuration">1800</item>
                  <item name="android:postSplashScreenTheme">@style/AppTheme</item>
              </style>
          </resources>
          EOF
          test -s android/app/src/main/res/values/styles.xml
          test -s android/app/src/main/res/values-v31/styles.xml

      - name: Sync Capacitor and SplashScreen plugin
        run: npx cap sync android

      - name: Verify native splash branding
        run: |
          test -d android/app/src/main/res
          test -s android/app/src/main/res/values/styles.xml
          test -s android/app/src/main/res/values-v31/styles.xml
          test -s android/app/src/main/res/drawable/splash.png
          echo '--- Native splash/icon files ---'
          find android/app/src/main/res -type f \( -name 'ic_launcher*' -o -name 'ic_launcher_foreground*' -o -name 'ic_launcher_background*' -o -name '*splash*' \) -print
          echo '--- Splash/theme references ---'
          grep -R -n -E 'splash|SplashScreen|AppTheme|windowSplashScreen|postSplashScreenTheme' android/app/src/main/res android/app/src/main/AndroidManifest.xml || true
          test -n "$(find android/app/src/main/res -type f \( -name '*splash*' -o -name 'ic_launcher*' \) -print -quit)"

      - name: Configure Android version for fresh SHRIVI build
        working-directory: android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode 4/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"3.0.2\"/" app/build.gradle
          chmod +x gradlew

      - name: Verify Gradle project
        run: |
          test -s android/gradlew
          test -d android/app

      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SHRIVI APK
        uses: actions/upload-artifact@v4
        with:
          name: SHRIVI-debug-apk-v4
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
