name: Build SHRIVI Android APK - Final

on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'resources/**'
      - 'manifest.json'
      - 'package.json'
      - '.github/workflows/build-android-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android is generated later, so Gradle caching is intentionally disabled here.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android and asset tooling
        run: |
          npm install --no-save @capacitor/cli @capacitor/core @capacitor/android @capacitor/splash-screen @capacitor/assets sharp typescript

      - name: Verify SHRIVI source assets
        run: |
          test -s resources/icon-source.svg
          test -s resources/icon.png
          test -s resources/splash-source.svg
          echo "SHRIVI icon and splash source assets found."

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Generate final Android icon and splash assets
        run: |
          npx capacitor-assets generate --android

      - name: Sync Capacitor with generated native assets
        run: |
          npx cap sync android

      - name: Verify final native icon and splash assets
        run: |
          test -d android/app/src/main/res
          find android/app/src/main/res -type f \( -name '*icon*' -o -name '*splash*' \) -print | sort
          test -n "$(find android/app/src/main/res -type f \( -name '*icon*' -o -name '*splash*' \) -print -quit)"

      - name: Verify generated Android project
        run: |
          test -s android/gradlew
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -d android/app
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SHRIVI debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHRIVI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
