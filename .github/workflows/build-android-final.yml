name: Build SHRIVI Android APK - Final

on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'resources/**'
      - 'manifest.json'
      - 'package.json'
      - '.github/workflows/build-android-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # This repo has no lockfile, so setup-node npm caching must stay disabled.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify Java, Node and npm
        run: |
          java -version
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Install Android and asset tooling
        run: npm install --no-save @capacitor/cli @capacitor/core @capacitor/android @capacitor/splash-screen @capacitor/assets sharp typescript

      - name: Verify branding sources
        run: |
          test -s resources/icon-source.svg
          test -s resources/splash-source.svg

      - name: Generate canonical PNG branding
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            await sharp('resources/icon-source.svg').resize(1024, 1024).png().toFile('resources/icon.png');
            await sharp('resources/splash-source.svg').resize(1024, 1024).png().toFile('resources/splash.png');
            for (const file of ['resources/icon.png', 'resources/splash.png']) {
              const m = await sharp(file).metadata();
              if (m.width !== 1024 || m.height !== 1024) throw new Error(`${file}: ${m.width}x${m.height}`);
            }
            console.log('SHRIVI icon and splash PNGs ready.');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Generate native Android icon and splash
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify native branding
        run: |
          test -d android/app/src/main/res
          find android/app/src/main/res -type f \( -name 'ic_launcher*' -o -name 'ic_launcher_foreground*' -o -name 'ic_launcher_background*' -o -name '*splash*' \) -print
          test -n "$(find android/app/src/main/res -type f \( -name 'ic_launcher*' -o -name 'ic_launcher_foreground*' -o -name 'ic_launcher_background*' -o -name '*splash*' \) -print -quit)"

      - name: Verify Gradle project
        run: |
          test -s android/gradlew
          test -d android/app
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SHRIVI APK
        uses: actions/upload-artifact@v4
        with:
          name: SHRIVI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Triggered intentionally from the fixed main branch so the Android workflow uses Java 21.
