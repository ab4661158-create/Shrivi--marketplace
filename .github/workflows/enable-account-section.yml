name: Enable SHRIVI Account section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enable-account:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Account UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('app-v2.html')
          s = p.read_text(encoding='utf-8')

          old_head = '<button class="iconbtn">♙<span>Account</span></button>'
          new_head = '<button class="iconbtn" onclick="openAccount()">♙<span>Account</span></button>'
          if old_head in s:
              s = s.replace(old_head, new_head, 1)

          old_bottom = '<button onclick="alert(\'Account section coming soon\')"><i>♙</i>Account</button>'
          new_bottom = '<button onclick="openAccount()"><i>♙</i>Account</button>'
          if old_bottom in s:
              s = s.replace(old_bottom, new_bottom, 1)

          modal = '''<div id="account" class="modal" onclick="if(event.target.id==='account')closeModal('account')"><div class="sheet"><button class="close" onclick="closeModal('account')">×</button><div id="accountBody"></div></div></div>'''
          marker = '<div id="track" class="modal">'
          if 'id="account" class="modal"' not in s and marker in s:
              s = s.replace(marker, modal + marker, 1)

          fn = '''function openAccount(){
            const name=localStorage.getItem('shrivi_customer_name')||'';
            const phone=localStorage.getItem('shrivi_customer_phone')||'';
            const email=localStorage.getItem('shrivi_customer_email')||'';
            const logged=!!(name||phone||email);
            $('accountBody').innerHTML=`<h2>♙ My Account</h2><div class="order"><b>${logged?'Welcome back!':'Welcome to SHRIVI'}</b><p>${logged?'Your account details are saved on this device.':'Manage your profile, orders and shopping from one place.'}</p></div><div class="form">${logged?`<input id="accountName" value="${esc(name)}" placeholder="Full Name"><input id="accountPhone" value="${esc(phone)}" placeholder="Mobile Number" inputmode="numeric" maxlength="10"><input id="accountEmail" value="${esc(email)}" placeholder="Email Address">`:`<input id="accountName" placeholder="Full Name"><input id="accountPhone" placeholder="Mobile Number" inputmode="numeric" maxlength="10"><input id="accountEmail" placeholder="Email Address">`}<button class="primary" onclick="saveAccount()">SAVE ACCOUNT</button></div><div class="order"><b>Quick Access</b><div class="actions"><button class="add" onclick="closeModal('account');openTrack()">My Orders</button><button class="buy" onclick="closeModal('account');openCart()">My Cart</button></div></div>${logged?'<button class="view" style="margin-top:12px" onclick="clearAccount()">Clear account from this device</button>':''}`;
            $('account').style.display='flex';
          }
          function saveAccount(){
            const name=$('accountName').value.trim(),phone=$('accountPhone').value.trim(),email=$('accountEmail').value.trim();
            if(!name||!/^[0-9]{10}$/.test(phone)||!/^\\S+@\\S+\\.\\S+$/.test(email)){toast('Enter valid name, mobile and email');return}
            localStorage.setItem('shrivi_customer_name',name);localStorage.setItem('shrivi_customer_phone',phone);localStorage.setItem('shrivi_customer_email',email);toast('Account saved');openAccount();
          }
          function clearAccount(){localStorage.removeItem('shrivi_customer_name');localStorage.removeItem('shrivi_customer_phone');localStorage.removeItem('shrivi_customer_email');toast('Account cleared');openAccount()}
          '''
          anchor = 'function closeModal(id){$(id).style.display=\'none\'}'
          if 'function openAccount()' not in s and anchor in s:
              s = s.replace(anchor, fn + anchor, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/enable-account-section.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v2.html .github/workflows/enable-account-section.yml
          if git diff --cached --quiet; then
            echo "No account changes needed"
            exit 0
          fi
          git commit -m "Enable customer Account section"
          git push