name: Fix Seller Image Upload

on:
  push:
    branches: [safe-gallery-fix-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[seller-image-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify seller image upload implementation
        run: |
          test -f seller.html
          grep -q 'productImageFiles' seller.html
          grep -q 'handleMultipleImageSelect' seller.html
          test -f seller-images-upgrade.js
          grep -q '/api/seller/upload/images' seller-images-upgrade.js
          echo "Seller 1-8 image upload implementation verified"
