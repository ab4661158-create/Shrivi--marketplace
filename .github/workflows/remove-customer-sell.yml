name: Remove Seller UI from Customer App

on:
  push:
    branches: [main]
    paths:
      - 'customer.html'
      - '.github/workflows/remove-customer-sell.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-seller-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify customer page does not expose Seller navigation
        run: |
          test -f customer.html
          if grep -nE "location\.href=['\"]?/seller|href=['\"]/seller" customer.html; then
            echo "Customer page still exposes Seller navigation"
            exit 1
          fi
          echo "Customer Seller navigation verified absent"
