name: Remove Seller UI from Customer App

on:
  push:
    paths:
      - 'customer.html'
      - '.github/workflows/remove-customer-sell.yml'

permissions:
  contents: write

jobs:
  remove-seller-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove seller UI from customer app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('customer.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(
              r'\s*<button\b(?=[^>]*onclick=["\'][^"\']*\/seller[^"\']*["\'])[^>]*>[\s\S]*?<\/button>\s*',
              '\n', s, flags=re.I
          )
          s = re.sub(
              r'\s*<a\b(?=[^>]*href=["\']\/seller["\'])[^>]*>[\s\S]*?<\/a>\s*',
              '\n', s, flags=re.I
          )

          s = re.sub(
              r'\n\s*<section[^>]*id=["\']seller["\'][^>]*>[\s\S]*?<\/section>\s*\n',
              '\n', s, flags=re.I
          )

          p.write_text(s, encoding='utf-8')
          print('Customer seller UI cleanup complete')
          PY

      - name: Commit customer app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove Sell option from customer app [skip ci]'
          git push
