name: Build SHRIVI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'capacitor.config.ts'
      - 'resources/**'
      - 'www/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor, icon tooling and TypeScript
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets typescript sharp

      - name: Create final SHRIVI 1024x1024 app icon
        run: node -e "require('sharp')('resources/icon-source.svg').resize(1024,1024).png().toFile('resources/icon.png').then(()=>console.log('SHRIVI icon generated'))"

      - name: Generate SHRIVI Android icon assets
        run: npx capacitor-assets generate --android

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHRIVI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
