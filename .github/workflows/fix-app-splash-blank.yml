name: Fix app splash blank-screen transition

on:
  push:
    branches: [fix-splash-blank-screen]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch splash timing and page-ready hide
        shell: python
        run: |
          from pathlib import Path

          cfg = Path('capacitor.config.ts')
          s = cfg.read_text()
          s = s.replace("launchAutoHide: true,", "launchAutoHide: false,")
          s = s.replace("launchShowDuration: 1800,", "launchShowDuration: 0,")
          s = s.replace("launchFadeOutDuration: 300,", "launchFadeOutDuration: 220,")
          cfg.write_text(s)

          page = Path('customer.html')
          s = page.read_text()
          marker = '<script>'
          inject = """<script>
          (function(){
            function hideShriviSplash(){
              try {
                var c = window.Capacitor;
                var p = c && c.Plugins && c.Plugins.SplashScreen;
                if (p && typeof p.hide === 'function') p.hide();
              } catch(e) {}
            }
            window.addEventListener('load', hideShriviSplash, {once:true});
            setTimeout(hideShriviSplash, 12000);
          })();
          </script>"""
          if 'hideShriviSplash' not in s:
            s = s.replace(marker, inject + marker, 1)
          page.write_text(s)

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- capacitor.config.ts customer.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: remove blank frame after app splash"
          git push
